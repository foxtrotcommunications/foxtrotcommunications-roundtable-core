name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roundtable
          POSTGRES_PASSWORD: roundtable
          POSTGRES_DB: roundtable_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate:up
        env:
          DATABASE_URL: postgresql://roundtable:roundtable@localhost:5432/roundtable_test

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://roundtable:roundtable@localhost:5432/roundtable_test
          SESSION_SECRET: ci-test-secret
          WORKSPACE_ID: ci-test

      - name: Typecheck
        run: npm run typecheck
