# Pendragon Capital — BigQuery Schema Reference
# Dataset: roundtable-public.pendragon_capital

tables:
  - name: positions
    description: Current portfolio holdings across all Pendragon funds. Refreshed daily.
    columns:
      - { name: fund, type: STRING, description: "Fund identifier (excalibur, arthur_equity, macro_alpha, gawain_risk)" }
      - { name: fund_name, type: STRING, description: "Human-readable fund name" }
      - { name: ticker, type: STRING, description: "Asset ticker symbol" }
      - { name: asset_name, type: STRING, description: "Full asset name" }
      - { name: asset_class, type: STRING, description: "equity, futures, fx, or crypto" }
      - { name: sector, type: STRING, description: "Sector classification" }
      - { name: quantity, type: INTEGER, description: "Number of shares/contracts/units held" }
      - { name: avg_entry_price, type: FLOAT, description: "Volume-weighted average entry price" }
      - { name: current_price, type: FLOAT, description: "Latest market price" }
      - { name: market_value, type: FLOAT, description: "Current market value (quantity × current_price)" }
      - { name: unrealized_pnl, type: FLOAT, description: "Unrealized profit/loss in USD" }
      - { name: unrealized_pnl_pct, type: FLOAT, description: "Unrealized P&L as percentage" }
      - { name: weight_pct, type: FLOAT, description: "Position weight as % of fund's total exposure" }
      - { name: as_of_date, type: DATE, description: "Snapshot date" }

  - name: trades
    description: Historical trade execution log. Includes all filled and cancelled orders.
    columns:
      - { name: trade_id, type: STRING, description: "Unique trade identifier (TRD-XXXXX)" }
      - { name: timestamp, type: TIMESTAMP, description: "Execution timestamp (UTC)" }
      - { name: fund, type: STRING, description: "Fund identifier" }
      - { name: fund_name, type: STRING, description: "Human-readable fund name" }
      - { name: ticker, type: STRING, description: "Asset ticker" }
      - { name: asset_name, type: STRING, description: "Full asset name" }
      - { name: asset_class, type: STRING, description: "equity, futures, fx, or crypto" }
      - { name: side, type: STRING, description: "BUY or SELL" }
      - { name: quantity, type: INTEGER, description: "Order quantity" }
      - { name: price, type: FLOAT, description: "Execution price" }
      - { name: notional, type: FLOAT, description: "Trade notional value (quantity × price)" }
      - { name: strategy, type: STRING, description: "Trading strategy (momentum, stat_arb, pairs_trade, etc.)" }
      - { name: broker, type: STRING, description: "Executing broker" }
      - { name: status, type: STRING, description: "FILLED or CANCELLED" }
      - { name: venue, type: STRING, description: "Execution venue (NYSE, NASDAQ, DARK_POOL)" }

  - name: risk_metrics
    description: Daily risk analytics per fund. Includes VaR, Sharpe, leverage, and exposure metrics.
    columns:
      - { name: date, type: DATE, description: "Reporting date" }
      - { name: fund, type: STRING, description: "Fund identifier" }
      - { name: fund_name, type: STRING, description: "Human-readable fund name" }
      - { name: strategy, type: STRING, description: "Fund strategy type" }
      - { name: nav, type: FLOAT, description: "Net asset value" }
      - { name: aum, type: FLOAT, description: "Assets under management" }
      - { name: var_1d_95, type: FLOAT, description: "1-day Value at Risk at 95% confidence (USD)" }
      - { name: var_1d_99, type: FLOAT, description: "1-day Value at Risk at 99% confidence (USD)" }
      - { name: var_10d_95, type: FLOAT, description: "10-day Value at Risk at 95% confidence (USD)" }
      - { name: sharpe_ratio, type: FLOAT, description: "Sharpe ratio (annualized)" }
      - { name: sortino_ratio, type: FLOAT, description: "Sortino ratio (annualized)" }
      - { name: max_drawdown_pct, type: FLOAT, description: "Maximum drawdown (negative %)" }
      - { name: beta, type: FLOAT, description: "Portfolio beta to S&P 500" }
      - { name: alpha_ann_pct, type: FLOAT, description: "Annualized alpha (%)" }
      - { name: volatility_ann_pct, type: FLOAT, description: "Annualized volatility (%)" }
      - { name: leverage_gross, type: FLOAT, description: "Gross leverage ratio" }
      - { name: leverage_net, type: FLOAT, description: "Net leverage ratio" }
      - { name: long_exposure_pct, type: FLOAT, description: "Long exposure as % of NAV" }
      - { name: short_exposure_pct, type: FLOAT, description: "Short exposure as % of NAV" }
      - { name: correlation_sp500, type: FLOAT, description: "Correlation to S&P 500" }

  - name: research_signals
    description: Alpha signals generated by the research team. Includes conviction scores and investment theses.
    columns:
      - { name: signal_id, type: STRING, description: "Unique signal identifier (SIG-XXXX)" }
      - { name: timestamp, type: TIMESTAMP, description: "Signal generation timestamp" }
      - { name: ticker, type: STRING, description: "Target asset ticker" }
      - { name: asset_name, type: STRING, description: "Full asset name" }
      - { name: sector, type: STRING, description: "Sector classification" }
      - { name: direction, type: STRING, description: "LONG or SHORT" }
      - { name: conviction, type: INTEGER, description: "Conviction score 1-5 (5 = highest)" }
      - { name: expected_return_pct, type: FLOAT, description: "Expected return (%)" }
      - { name: horizon_days, type: INTEGER, description: "Investment horizon in trading days" }
      - { name: source, type: STRING, description: "Signal source (quantitative_model, fundamental_analysis, etc.)" }
      - { name: thesis, type: STRING, description: "Investment thesis narrative" }
      - { name: analyst, type: STRING, description: "Analyst who generated the signal" }
      - { name: status, type: STRING, description: "active, expired, or executed" }

  - name: compliance_checks
    description: Pre-trade and post-trade compliance check results. Includes rule violations and resolutions.
    columns:
      - { name: check_id, type: STRING, description: "Unique check identifier (CHK-XXXXX)" }
      - { name: trade_id, type: STRING, description: "Associated trade identifier" }
      - { name: timestamp, type: TIMESTAMP, description: "Check timestamp" }
      - { name: fund, type: STRING, description: "Fund identifier" }
      - { name: fund_name, type: STRING, description: "Human-readable fund name" }
      - { name: ticker, type: STRING, description: "Asset ticker" }
      - { name: rule_name, type: STRING, description: "Compliance rule (position_concentration_limit, leverage_ratio_check, etc.)" }
      - { name: status, type: STRING, description: "PASS, FAIL, or REVIEW" }
      - { name: details, type: STRING, description: "Human-readable check details" }
      - { name: reviewer, type: STRING, description: "Assigned reviewer (for FAIL/REVIEW)" }
      - { name: resolution, type: STRING, description: "Resolution action (trade_cancelled, exception_granted, position_reduced, pending)" }
      - { name: resolved_at, type: TIMESTAMP, description: "Resolution timestamp" }

  - name: market_data
    description: Daily OHLCV market data for all tracked assets. 60-day lookback.
    columns:
      - { name: date, type: DATE, description: "Trading date" }
      - { name: ticker, type: STRING, description: "Asset ticker" }
      - { name: asset_name, type: STRING, description: "Full asset name" }
      - { name: asset_class, type: STRING, description: "equity, futures, fx, or crypto" }
      - { name: sector, type: STRING, description: "Sector classification" }
      - { name: open, type: FLOAT, description: "Opening price" }
      - { name: high, type: FLOAT, description: "Daily high" }
      - { name: low, type: FLOAT, description: "Daily low" }
      - { name: close, type: FLOAT, description: "Closing price" }
      - { name: volume, type: INTEGER, description: "Trading volume" }
      - { name: adj_close, type: FLOAT, description: "Adjusted closing price" }
      - { name: daily_return_pct, type: FLOAT, description: "Daily return (%)" }
