# Excalibur Execution — BigQuery Schema
# Dataset: roundtable-public.pc_execution
# Scope: Full cross-fund visibility for trade execution and order routing

views:
  - name: positions
    description: Current holdings across ALL Pendragon funds. Execution desk has full visibility for order routing and position management.
    columns:
      - { name: fund, type: STRING, description: "Fund identifier (excalibur, arthur_equity, macro_alpha, gawain_risk)" }
      - { name: fund_name, type: STRING, description: "Human-readable fund name" }
      - { name: ticker, type: STRING, description: "Asset ticker symbol" }
      - { name: asset_name, type: STRING, description: "Full asset name" }
      - { name: asset_class, type: STRING, description: "equity, futures, fx, or crypto" }
      - { name: sector, type: STRING, description: "Sector classification" }
      - { name: quantity, type: INTEGER, description: "Number of shares/contracts held" }
      - { name: avg_entry_price, type: FLOAT, description: "Volume-weighted average entry price" }
      - { name: current_price, type: FLOAT, description: "Latest market price" }
      - { name: market_value, type: FLOAT, description: "Current market value" }
      - { name: unrealized_pnl, type: FLOAT, description: "Unrealized P&L in USD" }
      - { name: unrealized_pnl_pct, type: FLOAT, description: "Unrealized P&L %" }
      - { name: weight_pct, type: FLOAT, description: "Position weight % of fund" }
      - { name: as_of_date, type: DATE }

  - name: trades
    description: Complete trade execution log across all funds and strategies.
    columns:
      - { name: trade_id, type: STRING, description: "Unique trade ID (TRD-XXXXX)" }
      - { name: timestamp, type: TIMESTAMP, description: "Execution timestamp" }
      - { name: fund, type: STRING }
      - { name: fund_name, type: STRING }
      - { name: ticker, type: STRING }
      - { name: asset_name, type: STRING }
      - { name: asset_class, type: STRING }
      - { name: side, type: STRING, description: "BUY or SELL" }
      - { name: quantity, type: INTEGER }
      - { name: price, type: FLOAT }
      - { name: notional, type: FLOAT, description: "Trade notional value" }
      - { name: strategy, type: STRING, description: "Trading strategy" }
      - { name: broker, type: STRING }
      - { name: status, type: STRING, description: "FILLED or CANCELLED" }
      - { name: venue, type: STRING, description: "NYSE, NASDAQ, or DARK_POOL" }

  - name: market_data
    description: Daily OHLCV for all tracked assets.
    columns:
      - { name: date, type: DATE }
      - { name: ticker, type: STRING }
      - { name: asset_name, type: STRING }
      - { name: asset_class, type: STRING }
      - { name: sector, type: STRING }
      - { name: open, type: FLOAT }
      - { name: high, type: FLOAT }
      - { name: low, type: FLOAT }
      - { name: close, type: FLOAT }
      - { name: volume, type: INTEGER }
      - { name: adj_close, type: FLOAT }
      - { name: daily_return_pct, type: FLOAT }

  - name: compliance_checks
    description: Compliance check results for all executed trades.
    columns:
      - { name: check_id, type: STRING }
      - { name: trade_id, type: STRING }
      - { name: timestamp, type: TIMESTAMP }
      - { name: fund, type: STRING }
      - { name: ticker, type: STRING }
      - { name: rule_name, type: STRING }
      - { name: status, type: STRING, description: "PASS, FAIL, or REVIEW" }
      - { name: details, type: STRING }
      - { name: reviewer, type: STRING }
      - { name: resolution, type: STRING }

note: |
  You do NOT have access to research_signals or risk_metrics.
  To get risk data, bridge to Gawain Risk via your contract.
  To get research signals, bridge to Merlin Research.
