# Pendragon Capital — Data Governance Guide
# This file provides general governance context. Your specific authorized
# tables and columns are injected into the system prompt from workspace config.

governance:
  model: least_privilege
  principle: |
    Each workspace has access ONLY to its authorized BigQuery views.
    Do NOT use INFORMATION_SCHEMA to discover tables.
    Do NOT query tables not listed in your authorized tables section.
    If you need data from another workspace, suggest using a Bridge.

  access_denied_behavior: |
    If a query returns "Access Denied" or "Table not found":
    1. STOP — do not guess alternative table names
    2. Tell the user which table you tried and the exact error
    3. Suggest they check with the workspace admin or use a Bridge

platform:
  name: Pendragon Capital Management
  project: roundtable-public
  query_rules:
    - Always use fully-qualified table names: `project.dataset.table`
    - Always include LIMIT clause (default 100)
    - Format results as markdown tables
