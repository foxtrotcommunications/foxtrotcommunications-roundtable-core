steps:
  - name: 'gcr.io/cloud-builders/docker'
    env:
      # Dockerfile uses `RUN --mount=type=secret` (GAR token for plugin installs),
      # which requires BuildKit.
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - '${_IMAGE}'
      - '.'
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/roundtable-public/roundtable/roundtable-core:latest
