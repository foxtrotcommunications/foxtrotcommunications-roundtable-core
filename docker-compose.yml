version: '3.8'

services:
  roundtable:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://roundtable:roundtable@postgres:5432/roundtable
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - WORKSPACE_ID=${WORKSPACE_ID:-dev}
      - WORKSPACE_NAME=${WORKSPACE_NAME:-Development}
      - EMBED_MODE=${EMBED_MODE:-false}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      # AI providers (optional — users can also set their own keys in-app)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - GCP_PROJECT=${GCP_PROJECT:-}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roundtable
      POSTGRES_PASSWORD: roundtable
      POSTGRES_DB: roundtable
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundtable"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
