# GCP-specific workspace template — connects through PgBouncer
# Cloud SQL proxy is NO LONGER on each workspace pod; it runs on the
# centralized PgBouncer pod instead. Workspace pods connect to the
# pgbouncer ClusterIP service.
#
# Usage:
#   export WORKSPACE_ID=dev WORKSPACE_NAME=Development
#   envsubst < k8s/overlays/gcp/workspace.yaml | kubectl apply -f -
#
# Prerequisites:
#   Deploy PgBouncer first: envsubst < k8s/overlays/gcp/pgbouncer.yaml | kubectl apply -f -
#   Per-workspace DB secret rt-${WORKSPACE_ID}-db (deploy-gke.sh creates it):
#     DATABASE_URL — connects as the workspace's OWN role rt_<id>
#                    (NOBYPASSRLS, DML only; RLS scopes every core table)
#     WS_ID        — the role name, which is also the workspace row id
#
# Secrets contract (3.4): the pod gets roundtable-shared-secrets (fleet-wide
# values such as SESSION_SECRET) plus its own rt-<id>-db. It never mounts
# roundtable-secrets — that secret holds the admin BYPASSRLS DATABASE_URL and
# the PgBouncer credentials, and a pod that can read it can read every
# tenant. Explicit `env` entries win over `envFrom`, so even if an older
# shared secret still carries a DATABASE_URL, the per-workspace one applies.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rt-${WORKSPACE_ID}
  labels:
    app: roundtable
    workspace: ${WORKSPACE_ID}
  annotations:
    # Workload Identity — maps this k8s SA to a GCP SA
    iam.gke.io/gcp-service-account: ${GCP_SA_EMAIL}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rt-${WORKSPACE_ID}
  labels:
    app: roundtable
    workspace: ${WORKSPACE_ID}
spec:
  serviceName: rt-${WORKSPACE_ID}
  replicas: 1
  selector:
    matchLabels:
      app: roundtable
      workspace: ${WORKSPACE_ID}
  template:
    metadata:
      labels:
        app: roundtable
        workspace: ${WORKSPACE_ID}
    spec:
      serviceAccountName: rt-${WORKSPACE_ID}
      containers:
        - name: roundtable
          image: ${ROUNDTABLE_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: roundtable-config
            - secretRef:
                name: roundtable-shared-secrets
          env:
            # Per-workspace DB identity — NOT the admin role.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rt-${WORKSPACE_ID}-db
                  key: DATABASE_URL
            - name: WS_ID
              valueFrom:
                secretKeyRef:
                  name: rt-${WORKSPACE_ID}-db
                  key: WS_ID
            - name: WORKSPACE_ID
              value: "${WORKSPACE_ID}"
            - name: WORKSPACE_NAME
              value: "${WORKSPACE_NAME}"
            - name: WORKSPACE_URL
              value: "http://rt-${WORKSPACE_ID}.${NAMESPACE}.svc.cluster.local:3000"
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
        # NOTE: Cloud SQL Auth Proxy sidecar has been moved to the PgBouncer pod.
        # Workspace pods connect to PostgreSQL through the pgbouncer ClusterIP service.
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rt-${WORKSPACE_ID}
  labels:
    app: roundtable
    workspace: ${WORKSPACE_ID}
spec:
  selector:
    app: roundtable
    workspace: ${WORKSPACE_ID}
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
