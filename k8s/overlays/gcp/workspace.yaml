# GCP-specific workspace template — connects through PgBouncer
# Cloud SQL proxy is NO LONGER on each workspace pod; it runs on the
# centralized PgBouncer pod instead. Workspace pods connect to the
# pgbouncer ClusterIP service.
#
# Usage:
#   export WORKSPACE_ID=dev WORKSPACE_NAME=Development
#   envsubst < k8s/overlays/gcp/workspace.yaml | kubectl apply -f -
#
# Prerequisites:
#   Deploy PgBouncer first: envsubst < k8s/overlays/gcp/pgbouncer.yaml | kubectl apply -f -
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rt-${WORKSPACE_ID}
  labels:
    app: roundtable
    workspace: ${WORKSPACE_ID}
  annotations:
    # Workload Identity — maps this k8s SA to a GCP SA
    iam.gke.io/gcp-service-account: ${GCP_SA_EMAIL}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rt-${WORKSPACE_ID}
  labels:
    app: roundtable
    workspace: ${WORKSPACE_ID}
spec:
  serviceName: rt-${WORKSPACE_ID}
  replicas: 1
  selector:
    matchLabels:
      app: roundtable
      workspace: ${WORKSPACE_ID}
  template:
    metadata:
      labels:
        app: roundtable
        workspace: ${WORKSPACE_ID}
    spec:
      serviceAccountName: rt-${WORKSPACE_ID}
      containers:
        - name: roundtable
          image: ${ROUNDTABLE_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: roundtable-config
            - secretRef:
                name: roundtable-secrets
          env:
            - name: WORKSPACE_ID
              value: "${WORKSPACE_ID}"
            - name: WORKSPACE_NAME
              value: "${WORKSPACE_NAME}"
            - name: WORKSPACE_URL
              value: "http://rt-${WORKSPACE_ID}.${NAMESPACE}.svc.cluster.local:3000"
          volumeMounts:
            - name: workspace
              mountPath: /app/workspace
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
        # NOTE: Cloud SQL Auth Proxy sidecar has been moved to the PgBouncer pod.
        # Workspace pods connect to PostgreSQL through the pgbouncer ClusterIP service.
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rt-${WORKSPACE_ID}
  labels:
    app: roundtable
    workspace: ${WORKSPACE_ID}
spec:
  selector:
    app: roundtable
    workspace: ${WORKSPACE_ID}
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
