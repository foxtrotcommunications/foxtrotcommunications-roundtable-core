# GCP-specific PgBouncer deployment with Cloud SQL Auth Proxy sidecar
# Replaces Cloud SQL proxy sidecars on individual workspace pods —
# all workspace pods connect to this single PgBouncer service instead.
#
# Usage:
#   export CLOUDSQL_CONNECTION=your-project:us-central1:roundtable-db
#   export GCP_SA_EMAIL=roundtable-gke@your-project.iam.gserviceaccount.com
#   envsubst < k8s/overlays/gcp/pgbouncer.yaml | kubectl apply -f -
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  labels:
    app: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    * = host=127.0.0.1 port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt

    ; Transaction-mode pooling — the key setting for connection multiplexing
    pool_mode = transaction

    ; Real Postgres connections per user/db pair
    default_pool_size = 2

    ; Keep some connections warm even when idle
    min_pool_size = 0

    ; Hard cap on total real Postgres connections
    max_db_connections = 20

    ; Max concurrent client connections from workspace pods
    max_client_conn = 400

    ; Reserve connections for admin queries when pool is full
    reserve_pool_size = 2
    reserve_pool_timeout = 3

    ; Clean session state when returning connection to pool
    server_reset_query = DISCARD ALL

    ; Health checks
    server_check_query = SELECT 1
    server_check_delay = 30

    ; Logging
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60

    ; node-postgres compatibility
    ignore_startup_parameters = extra_float_digits,search_path

    ; Admin access
    admin_users = roundtable
    stats_users = roundtable
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
  annotations:
    iam.gke.io/gcp-service-account: ${GCP_SA_EMAIL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      serviceAccountName: pgbouncer
      # userlist.txt is provided via ConfigMap (generated by setup.sh)
      # Contains all per-workspace roles + admin credentials
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 6432
              name: pgbouncer
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
            - name: pgbouncer-auth
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
        # Cloud SQL Auth Proxy sidecar — PgBouncer connects to Postgres through this
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.15.2
          args:
            - "${CLOUDSQL_CONNECTION}"
            - "--port=5432"
            - "--structured-logs"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            runAsNonRoot: true
      volumes:
        - name: pgbouncer-config
          configMap:
            name: pgbouncer-config
        - name: pgbouncer-auth
          configMap:
            name: pgbouncer-userlist
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
      targetPort: 6432
      name: postgres
  type: ClusterIP
