# Sensitive configuration — create with:
#   kubectl create secret generic roundtable-secrets \
#     --from-literal=SESSION_SECRET=$(openssl rand -hex 32) \
#     --from-literal=DATABASE_URL=postgresql://roundtable:PASSWORD@127.0.0.1:5432/roundtable
#
# Note: DATABASE_URL points to 127.0.0.1 because the Cloud SQL proxy
# sidecar runs in the same pod and exposes Postgres on localhost.
apiVersion: v1
kind: Secret
metadata:
  name: roundtable-secrets
type: Opaque
data:
  # Replace with your base64-encoded values
  # echo -n "your-secret" | base64
  SESSION_SECRET: Y2hhbmdlLW1l  # placeholder — MUST be replaced
