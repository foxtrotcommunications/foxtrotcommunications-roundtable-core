# Ingress — exposes workspaces externally with WebSocket support
#
# Works with:
#   - nginx-ingress (GKE, EKS, AKS, bare metal)
#   - AWS ALB Ingress Controller (see overlays/aws/)
#   - Azure Application Gateway Ingress (see overlays/azure/)
#
# For nginx-ingress install:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#
# Add workspace paths as you deploy them:
#   /          → rt-dev (default workspace)
#   /backend   → rt-backend
#   /data      → rt-data
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roundtable-ingress
  annotations:
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Session affinity for Socket.IO
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "rt-affinity"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rt-dev
                port:
                  number: 3000
