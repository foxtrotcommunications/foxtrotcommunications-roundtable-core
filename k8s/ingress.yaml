# Ingress — exposes workspaces via subdomains or paths
# Requires: nginx-ingress controller or GKE Gateway
#
# Pattern: each workspace gets a path prefix
#   https://roundtable.example.com/backend → rt-backend service
#   https://roundtable.example.com/data    → rt-data service
#
# For WebSocket support with nginx-ingress:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roundtable-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "rt-dev"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "rt-affinity"
spec:
  ingressClassName: nginx
  rules:
    # Add a rule for each workspace
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rt-dev
                port:
                  number: 3000
