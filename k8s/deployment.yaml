apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundtable
  labels:
    app: roundtable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roundtable
  template:
    metadata:
      labels:
        app: roundtable
    spec:
      containers:
        - name: roundtable
          image: roundtable:latest
          ports:
            - containerPort: 3000
          envFrom:
            # Non-sensitive config
            - configMapRef:
                name: roundtable-config
            # Secrets (SESSION_SECRET, DATABASE_URL, API keys)
            - secretRef:
                name: roundtable-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: workspace
              mountPath: /app/workspace
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: roundtable-data
        - name: workspace
          persistentVolumeClaim:
            claimName: roundtable-workspace
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roundtable-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roundtable-workspace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
